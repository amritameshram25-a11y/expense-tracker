
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Expense Tracker</h1>
        <p>Manage your money smartly</p>
      </div>
      <span class="logo">💰</span>
    </header>

    <section class="summary">
      <div class="card">
        <p>Total Balance</p>
        <h2 id="balance">₹0</h2>
      </div>
      <div class="card">
        <p>Total Income</p>
        <h2 id="income">₹0</h2>
      </div>
      <div class="card">
        <p>Total Expenses</p>
        <h2 id="expense">₹0</h2>
      </div>
    </section>

    <section class="content">
      <div class="panel">
        <h2>Add Transaction</h2>

        <form id="transactionForm">
          <label>Title</label>
          <input id="title" type="text" placeholder="e.g. Shopping" required>

          <label>Amount (₹)</label>
          <input id="amount" type="number" min="1" placeholder="Enter amount" required>

          <label>Type</label>
          <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

          <label>Category</label>
          <select id="category">
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>

          <label>Date</label>
          <input id="date" type="date" required>

          <button type="submit">Add Transaction</button>
        </form>
      </div>

      <div class="panel">
        <h2>Monthly Summary</h2>
        <p id="monthSummary">This month's expenses: ₹0</p>
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <section class="panel transactions">
      <div class="transaction-header">
        <h2>Recent Transactions</h2>
        <input id="search" type="search" placeholder="Search transactions...">
      </div>
      <div id="transactionList"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
